<body data-page="login">
<main class="login">
  <form class="login-card" id="login-form" novalidate>
    <a class="brand" href="/"><svg viewBox="0 0 256 256" fill="none" aria-hidden="true"><g transform="translate(128,128) scale(1.42) translate(-99.8,-90)" stroke-linejoin="miter"><polygon points="60,46 99.8,68 99.8,112 60,134 20.2,112 20.2,68" stroke="#3a4a52" stroke-width="5"/><polygon points="99.8,68 139.6,46 179.4,68 179.4,112 139.6,134 99.8,112" stroke="#5fc89b" stroke-width="5"/><path d="M 126.6 116 L 139.6 58 L 152.6 116 M 131.1 95 L 148.1 95" stroke="#5fc89b" stroke-width="5"/><circle cx="99.8" cy="68" r="6" fill="#5fc89b"/><circle cx="99.8" cy="112" r="6" fill="#5fc89b"/></g></svg><span><span class="brand-name">Axis FitoMed</span><span class="brand-sub">Portal do associado</span></span></a>
    <div><h1>Entrar</h1><p class="p-lead" style="font-size:var(--t-sm)">Catálogo liberado pela sua receita, pedidos e rastreio.</p></div>
    <label class="field">E-mail ou CPF<input type="text" name="user" autocomplete="username" value="marco@exemplo.com"></label>
    <label class="field">Senha<input type="password" name="pass" autocomplete="current-password" value="••••••••"></label>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    <p class="login-note">Protótipo: qualquer e-mail e senha entram. Na versão final, acesso por e-mail e código de uso único.</p>
    <p class="login-foot"><a href="/">Voltar ao site</a> · <a href="/contato">Ainda não sou associado</a></p>
  </form>
</main>
